[program:k-beauty-backend]
directory=/www/wwwroot/k-beauty-proxy-mall/backend
command=/www/wwwroot/k-beauty-proxy-mall/backend/.venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stdout_logfile=/www/wwwlogs/k-beauty-backend.out.log
stderr_logfile=/www/wwwlogs/k-beauty-backend.err.log
environment=PYTHONUNBUFFERED="1"

